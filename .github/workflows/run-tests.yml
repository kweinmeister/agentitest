name: Run Agentic Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run pytest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Pin CI a tier below the default model to keep these agentic browser
          # runs cheap. The default stays gemini-3.7-flash for local runs.
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          HEADLESS: "true"
          BROWSER_USE_DISABLE_EXTENSIONS: "true"
          TIMEOUT_BrowserStartEvent: "120"
          TIMEOUT_BrowserLaunchEvent: "120"
        run: pytest
